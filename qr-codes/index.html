<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JourneyWithGemini Repository QR Codes</title>
  <style>
    body { margin: 0; padding: 40px 20px; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    h1 { text-align: center; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #6b7280; margin-bottom: 35px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1); }
    .qr { width: 220px; height: 220px; max-width: 100%; margin-bottom: 18px; }
    .repository-url { color: #6b7280; font-size: 14px; word-break: break-word; margin-bottom: 18px; }
    .button { display: inline-block; padding: 10px 16px; border-radius: 8px; background: #2563eb; color: white; text-decoration: none; font-weight: bold; }
    .button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>JourneyWithGemini Repository QR Codes</h1>
  <p class="subtitle">Scan a QR code to open a repository.</p>
  <main class="gallery">
    <section class="card">
      <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&amp;data=https%3A%2F%2Fgithub.com%2FJourneyWithGemini%2FJourney-with-Gemini" alt="QR code for Journey-with-Gemini">
      <h2>Journey-with-Gemini</h2>
      <p class="repository-url">https://github.com/JourneyWithGemini/Journey-with-Gemini</p>
      <a class="button" href="https://github.com/JourneyWithGemini/Journey-with-Gemini" target="_blank" rel="noopener noreferrer">Open repository</a>
    </section>
  </main>
</body>
</html>
